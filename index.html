<style>
/* Layout: agency case-study format. A work index of large media tiles; each project opens as its own page:
   huge title, meta row, full-bleed media, narrative text, media pairs, then next-project links. Black/white chrome, color lives in the media. */
:root{
  --bg:#ffffff;
  --fg:#0d0d0d;
  --muted:#6b6b6b;
  --line:#e2e2e2;
  --chip:#f2f2f2;
  --sans:"Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  /* project media colors (imagery: same in both themes) */
  --chalet-a:#1f3d2b; --chalet-b:#cfe0c3;
  --tarts-a:#e9c4b6;  --tarts-b:#7a2e2a;
  --unm-a:#1d4fa3;    --unm-b:#f6c945;
  --dn:#4e2a84; --dt:#990000;
  --ws-a:#ff6b2c;     --ws-b:#1a1a1a;
  --gutter:clamp(16px,3vw,40px);
  --hl:#ffe45c; --hl-ink:#0d0d0d;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--fg:#f4f4f4;--muted:#9a9a9a;--line:#262626;--chip:#1c1c1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d0d;--fg:#f4f4f4;--muted:#9a9a9a;--line:#262626;--chip:#1c1c1c;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{padding-inline:var(--gutter);max-width:1600px;margin:0 auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--muted)}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:14px}
.logo{font-weight:800;font-stretch:110%;font-size:20px;text-decoration:none;letter-spacing:-.01em}
.top nav{display:flex;gap:clamp(14px,2.5vw,28px);font-size:15px;font-weight:500}
.top nav a{text-decoration:none}
.top nav a:hover,.top nav a[aria-current="page"]{text-decoration:underline;text-underline-offset:4px}

/* Home */
.intro{padding-block:clamp(56px,9vw,120px) clamp(32px,4vw,48px)}
.intro h1{font-weight:800;font-stretch:90%;font-size:clamp(44px,8vw,128px);line-height:.95;letter-spacing:-.03em;max-width:14ch}
.intro p{margin-top:28px;max-width:46ch;font-size:clamp(18px,1.8vw,22px);line-height:1.45}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gutter);padding-bottom:clamp(64px,8vw,120px)}
.tile{text-decoration:none;display:block;min-width:0}
.tile .media{aspect-ratio:4/3}
.tile h2{margin-top:16px;font-weight:700;font-size:clamp(22px,2.2vw,30px);letter-spacing:-.015em;line-height:1.1}
.tile p{margin-top:6px;color:var(--muted);font-size:16px}
.tile .media-inner{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.tile:hover .media-inner{transform:scale(1.03)}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.tile .media-inner{transition:none}.tile:hover .media-inner{transform:none}}

.tile-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:16px}
.tile-head h2{margin-top:0}
.tile .since{white-space:nowrap;color:var(--muted)}
.tenure{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--fg);border-bottom:1px solid var(--line)}

.ex{display:flex;flex-direction:column;gap:10px;padding:clamp(20px,2.4vw,32px);background:var(--chip);text-decoration:none;min-width:0;transition:background .25s,color .25s}

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function media(p, cls="", label="Campaign image", invert=false, usePhoto=false){
  if(usePhoto && p.img){
    return `<div class="media photo ${cls}"><img src="${p.img}" alt="${esc(p.imgAlt)}" style="object-position:${p.imgPos||"center"}"></div>`;
  }
  const bg = invert ? p.b : p.a, fg = invert ? p.a : p.b;
  return `<div class="media ${cls}" style="background:var(${bg});color:var(${fg})" role="img" aria-label="${esc(p.client)} placeholder image">
    <div class="media-inner">${ART[p.art]}</div>
    <span class="tag">${label}</span>
  </div>`;
}

  document.querySelectorAll("[data-nav]").forEach(a=>a.removeAttribute("aria-current"));
  if(id==="writing" || id==="social" || id==="work"){
    app.innerHTML = id==="writing" ? writing() : id==="social" ? social() : workPage();
    window.scrollTo(0,0);
    document.title = (id==="writing" ? "Writing" : id==="social" ? "Social" : "Work") + " · Lauren Kim";

    app.innerHTML = caseStudy(p);

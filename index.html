<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lauren Kim</title>
<meta name="description" content="Lauren Kim: storyteller, critical thinker and analyst. Brand and go-to-market strategy, journalism, research and content.">
<style>*,*::before,*::after{box-sizing:border-box}:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: agency case-study format. A work index of large media tiles; each project opens as its own page:
   huge title, meta row, full-bleed media, narrative text, media pairs, then next-project links. Black/white chrome, color lives in the media. */
:root{
  --bg:#ffffff;
  --fg:#0d0d0d;
  --muted:#6b6b6b;
  --line:#e2e2e2;
  --chip:#f2f2f2;
  --sans:"Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  /* project media colors (imagery: same in both themes) */
  --chalet-a:#1f3d2b; --chalet-b:#cfe0c3;
  --tarts-a:#e9c4b6;  --tarts-b:#7a2e2a;
  --unm-a:#1d4fa3;    --unm-b:#f6c945;
  --dn:#4e2a84; --dt:#990000;
  --ws-a:#ff6b2c;     --ws-b:#1a1a1a;
  --gutter:clamp(16px,3vw,40px);
  --tt-cream:#f8f4ec; --tt-sage:#4a6b57; --tt-sage-soft:#dfe9e1; --tt-ink:#26302a;
  --hl:#ffe45c; --hl-ink:#0d0d0d;
  --t-yellow:#fff4b8; --t-blue:#dcebff; --t-pink:#ffe0e6; --t-green:#dcf1e1; --t-lav:#ebe4ff;
  --c-yellow:#f2c200; --c-blue:#2f6fe0; --c-pink:#e2486f; --c-green:#2e9b57; --c-lav:#7a5cf0; --c-gold:#b07d00;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--fg:#f4f4f4;--muted:#9a9a9a;--line:#262626;--chip:#1c1c1c;--t-yellow:#3a3214;--t-blue:#16263f;--t-pink:#3d1a24;--t-green:#15301f;--t-lav:#251d42;--c-yellow:#ffd84a;--c-blue:#7fb0ff;--c-pink:#ff8fab;--c-green:#6fd394;--c-lav:#b4a2ff;--c-gold:#ffd84a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d0d;--fg:#f4f4f4;--muted:#9a9a9a;--line:#262626;--chip:#1c1c1c;--t-yellow:#3a3214;--t-blue:#16263f;--t-pink:#3d1a24;--t-green:#15301f;--t-lav:#251d42;--c-yellow:#ffd84a;--c-blue:#7fb0ff;--c-pink:#ff8fab;--c-green:#6fd394;--c-lav:#b4a2ff;--c-gold:#ffd84a;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{padding-inline:var(--gutter);max-width:1600px;margin:0 auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--muted)}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:14px}
.logo{font-weight:700;font-stretch:100%;font-size:20px;text-decoration:none;letter-spacing:-.01em}
.top nav{display:flex;gap:clamp(14px,2.5vw,28px);font-size:15px;font-weight:500}
.top nav a{text-decoration:none}
.top nav a:hover,.top nav a[aria-current="page"]{text-decoration:underline;text-underline-offset:4px}

/* Home */
.intro{padding-block:clamp(56px,9vw,120px) clamp(26px,3vw,38px)}
.intro h1{font-weight:700;font-stretch:96%;font-size:clamp(34px,5vw,72px);line-height:.95;letter-spacing:-.03em;max-width:14ch}
.intro p{margin-top:28px;max-width:46ch;font-size:clamp(18px,1.8vw,22px);line-height:1.45}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gutter);padding-bottom:clamp(64px,8vw,120px)}
.tile{text-decoration:none;display:block;min-width:0}
.tile .media{aspect-ratio:4/3}
.tile h2{margin-top:16px;font-weight:700;font-size:clamp(22px,2.2vw,30px);letter-spacing:-.015em;line-height:1.1}
.tile p{margin-top:6px;color:var(--muted);font-size:16px}
.tile .media-inner{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.tile:hover .media-inner{transform:scale(1.03)}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.tile .media-inner{transition:none}.tile:hover .media-inner{transform:none}}

.tile-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:16px}
.tile-head h2{margin-top:0}
.tile .since{white-space:nowrap;color:var(--muted)}
.tenure{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--fg);border-bottom:1px solid var(--line)}
.ten{display:flex;flex-direction:column;gap:2px;padding:24px 20px 24px 0;text-decoration:none;min-width:0}
.ten + .ten{padding-left:20px;border-left:1px solid var(--line)}
.ten .num{font-weight:700;font-stretch:91%;font-size:clamp(24px,2.6vw,34px);line-height:.95;letter-spacing:-.022em;font-variant-numeric:tabular-nums}
.ten .unit{font-size:15px;font-weight:600;margin-bottom:14px}
.ten .who{font-weight:600;font-size:16px;line-height:1.25}
.ten:hover .who{text-decoration:underline;text-underline-offset:3px}
.tenure-note{max-width:60ch;font-size:clamp(17px,1.6vw,20px);padding-block:24px clamp(48px,6vw,80px);color:var(--muted)}
.tenure-note strong{color:var(--fg)}
@media (max-width:820px){.tenure{grid-template-columns:repeat(2,minmax(0,1fr))}.ten:nth-child(3){padding-left:0;border-left:0}.ten:nth-child(n+3){border-top:1px solid var(--line)}}
.roots-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:28px}
.roots{padding:20px 22px;background:var(--chip);min-width:0}
@media (max-width:620px){.roots-grid{grid-template-columns:1fr}}
.strategy{border-top:1px solid var(--fg);padding-block:clamp(48px,7vw,104px)}
.strategy-h{margin-top:16px;font-weight:700;font-stretch:94%;font-size:clamp(34px,5vw,72px);line-height:1;letter-spacing:-.022em}
.strategy-lede{margin-top:28px;max-width:52ch;font-size:clamp(20px,2.2vw,30px);line-height:1.35;font-weight:500;letter-spacing:-.01em}
.principles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:clamp(36px,5vw,64px)}
.principles > div{border-top:1px solid var(--line);padding-top:16px;min-width:0}
.principles h3{font-size:20px;font-weight:700;line-height:1.2}
.principles p{margin-top:8px;font-size:15.5px;color:var(--muted)}
@media (max-width:900px){.principles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.principles{grid-template-columns:1fr}}
.section-label{border-top:1px solid var(--fg);padding-block:16px 20px}
.roots p{margin-top:8px;font-size:18px;font-weight:500;line-height:1.45}
.me{display:grid;grid-template-columns:7fr 5fr;gap:clamp(28px,5vw,72px);align-items:end;padding-block:clamp(48px,8vw,112px) clamp(48px,6vw,88px)}
.me > *{min-width:0}
.me h1{margin-top:20px;font-weight:700;font-stretch:91%;font-size:clamp(38px,5.5vw,80px);line-height:1;letter-spacing:-.025em}
.me-lede{margin-top:28px;max-width:46ch;font-size:clamp(19px,1.9vw,24px);line-height:1.45}
.me-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-block;padding:12px 22px;border:1px solid var(--fg);border-radius:999px;font-weight:600;font-size:15px;text-decoration:none}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn:hover{background:var(--fg);color:var(--bg)}
.me-photo{aspect-ratio:4/5;max-width:100%;position:relative;overflow:hidden;background:var(--chip)}
.me-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
@media (max-width:820px){.me{grid-template-columns:1fr}.me-photo{aspect-ratio:1/1;max-width:360px}}
.explore{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gutter);padding-bottom:clamp(48px,6vw,88px)}
.ex{display:flex;flex-direction:column;gap:10px;padding:clamp(20px,2.4vw,32px);background:var(--chip);text-decoration:none;min-width:0;transition:background .25s,color .25s}
.ex h2{font-weight:700;font-stretch:94%;font-size:clamp(24px,2.6vw,34px);line-height:.95;letter-spacing:-.02em}
.ex p{font-size:16px;color:var(--muted);flex:1}
.ex-go{font-weight:600;font-size:15px;margin-top:8px}
.ex:hover{background:var(--fg);color:var(--bg)}
.ex:hover .muted,.ex:hover p{color:var(--bg);opacity:.75}
@media (max-width:820px){.explore{grid-template-columns:1fr}}
.pillars.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.pillars.three .pillar h3{font-size:clamp(24px,2.6vw,34px)}
@media (max-width:900px){.pillars.three{grid-template-columns:1fr}}
.sides{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gutter);margin-top:36px}
.side{min-width:0;border-top:1px solid var(--fg);padding-top:16px}
.side h3{margin-top:8px;font-weight:700;font-stretch:94%;font-size:clamp(24px,2.6vw,34px);line-height:.95;letter-spacing:-.03em}
.side ul{list-style:none;margin:20px 0 0;padding:0}
.side li{display:grid;gap:2px;padding-block:12px;border-bottom:1px solid var(--line)}
.side li strong{font-size:17px}
.side li span{font-size:15px;color:var(--muted)}
@media (max-width:900px){.sides{grid-template-columns:1fr}}
.tt-features{display:grid;gap:var(--gutter)}
.tt-feature{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center;text-decoration:none}
.tt-feature .tt-img{width:100%}
.tt-copy{min-width:0;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.tt-copy h3{font-weight:700;font-stretch:94%;font-size:clamp(28px,3.4vw,44px);line-height:1;letter-spacing:-.02em}
.tt-copy p{font-size:18px;max-width:44ch;color:var(--muted)}
.tt-copy .btn{margin-top:8px}
a.tt-feature:hover .btn{opacity:.85}
.tt-brand{position:absolute;left:16px;top:16px;right:16px;font-weight:700;font-stretch:94%;font-size:24px;line-height:1;letter-spacing:-.02em;color:var(--fg)}
@media (max-width:620px){.tt-feature{grid-template-columns:1fr}.tt-feature .tt-img{max-width:240px}}
.status-pill{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--fg);color:var(--fg);border-radius:999px;padding:2px 8px;vertical-align:1px}
.status-row{margin-top:clamp(20px,3vw,32px)}
.yt-dek{font-size:15px;color:var(--muted);max-width:52ch}
.tt-title{font-weight:700;font-stretch:94%;font-size:clamp(22px,2.2vw,30px);line-height:1;letter-spacing:-.02em}
.tt-result{display:inline-block;align-self:flex-start;background:var(--fg);color:var(--bg);font-weight:700;font-size:14px;padding:4px 10px;border-radius:999px}
.tt .tt-cap{font-size:15px;font-weight:400;color:var(--muted);line-height:1.45}
a.tt:hover .tt-title{text-decoration:underline;text-underline-offset:4px}
.numbers{margin-top:clamp(40px,6vw,80px);border-top:1px solid var(--line);padding-top:24px}
.numbers-head h3{margin:0;font-weight:700;font-stretch:91%;font-size:clamp(32px,4.4vw,60px);line-height:1;letter-spacing:-.022em}
.numbers-video{display:block;margin-top:12px;font-weight:600;font-size:clamp(17px,1.6vw,20px)}
.numbers-head p{margin-top:6px;font-size:14px;color:var(--muted)}
.numbers-body{display:block;margin-top:28px}
.numbers-shots{display:grid;grid-template-columns:repeat(2,minmax(0,280px));gap:var(--gutter);margin-top:28px}
.numbers-main{max-width:1000px}
.numbers-shot{margin:0}
.numbers-shot img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:12px}
.numbers-shot figcaption{margin-top:8px;font-size:11px}
.numbers-main{min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0;border-top:1px solid var(--fg)}
.stats > div{padding:16px 16px 16px 0;border-bottom:1px solid var(--line);min-width:0}
.stats dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:6px 0 0;font-weight:700;font-stretch:94%;font-size:clamp(28px,3vw,44px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats span{display:block;margin-top:6px;font-size:13px;color:var(--muted);line-height:1.3}
.insights{margin-top:32px;display:grid;gap:18px}
.insight h4{margin:0;font-size:20px;font-weight:700}
.insight p{margin-top:4px;font-size:16px;color:var(--muted);max-width:60ch}
.next{padding:16px 18px;background:var(--chip);font-size:16px;max-width:64ch}
@media (max-width:520px){.numbers-shots{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.numbers-sub{margin-top:clamp(40px,5vw,64px);padding-top:20px;border-top:1px solid var(--line)}
.numbers-sub h4{margin:6px 0 0;font-weight:700;font-stretch:94%;font-size:clamp(24px,2.6vw,36px);line-height:1;letter-spacing:-.025em}
.photo-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-bottom:clamp(40px,5vw,72px)}
.ps-item{display:flex;flex-direction:column;gap:4px;text-decoration:none;min-width:0}
.ps-img{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;background:var(--chip);margin-bottom:8px}
.ps-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.ps-item:hover .ps-img img{transform:scale(1.05)}
.ps-tag{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--bg);color:var(--fg);padding:3px 8px;border-radius:999px}
.ps-name{font-weight:700;font-size:16px;line-height:1.2}
.ps-item:hover .ps-name{text-decoration:underline;text-underline-offset:3px}
@media (max-width:760px){.photo-strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.ps-img img{transition:none}.ps-item:hover .ps-img img{transform:none}}
.cities{display:flex;flex-wrap:wrap;gap:6px 0;margin-top:28px;font-weight:700;font-stretch:94%;font-size:clamp(22px,2.6vw,36px);line-height:1;letter-spacing:-.03em}
.cities span{white-space:nowrap}
.cities span + span::before{content:"→";font-weight:400;color:var(--muted);margin:0 .35em}
.world-media{aspect-ratio:4/3;max-width:960px}
.people-media{aspect-ratio:3/2;max-width:100%}
.duo{display:grid;grid-template-columns:2fr 1fr;gap:var(--gutter)}
.duo figure{margin:0;min-width:0}
.store-media{aspect-ratio:3/4;max-width:100%}
@media (max-width:620px){.duo{grid-template-columns:1fr}.store-media{aspect-ratio:4/5}}
.extras{display:grid;grid-template-columns:repeat(2,minmax(0,420px));gap:var(--gutter)}
.extra{margin:0;min-width:0}
@media (max-width:560px){.extras{grid-template-columns:1fr}}
.extra-media{aspect-ratio:1/1;max-width:100%}
.numbers-lede{margin-top:20px;max-width:46ch;font-size:clamp(20px,2.2vw,30px);line-height:1.35;font-weight:500;letter-spacing:-.01em}
.numbers-lede mark{background:var(--hl);color:var(--hl-ink);padding:0 .15em;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.method{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gutter);margin:clamp(24px,3vw,40px) 0 clamp(28px,4vw,48px);max-width:1000px}
.method > div{border-top:3px solid var(--hl);padding-top:14px;min-width:0}
.method .mono{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.method h4{margin:6px 0 0;font-size:20px;font-weight:700}
.method p{margin-top:6px;font-size:15px;color:var(--muted)}
@media (max-width:720px){.method{grid-template-columns:1fr}}
.yt-grid.single{grid-template-columns:minmax(0,760px)}
.gtm{border-top:1px solid var(--fg);padding-block:clamp(48px,7vw,104px)}
.gtm-h{margin-top:16px;font-weight:700;font-stretch:94%;font-size:clamp(32px,4.4vw,60px);line-height:1.02;letter-spacing:-.022em;max-width:14ch}
.gtm-lede{margin-top:24px;max-width:52ch;font-size:clamp(19px,2vw,26px);line-height:1.4;font-weight:500}
.gtm-lede mark{background:var(--hl);color:var(--hl-ink);padding:0 .15em;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.gtm-cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gutter);margin-top:clamp(32px,4vw,56px)}
.gtm-case{background:var(--chip);padding:clamp(20px,2.4vw,32px);min-width:0;display:flex;flex-direction:column;gap:10px}
.gtm-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gtm-badge{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--hl);color:var(--hl-ink);padding:3px 9px;border-radius:999px}
.gtm-logo{width:72px;height:72px;border-radius:10px;display:block;object-fit:cover;background:#fff}
.gtm-case h3{font-weight:700;font-stretch:94%;font-size:clamp(26px,2.8vw,40px);line-height:1;letter-spacing:-.03em}
.gtm-case dl{margin:6px 0 0;display:grid;gap:10px}
.gtm-case dl > div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;border-top:1px solid var(--line);padding-top:10px}
.gtm-case dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.gtm-case dd{margin:0;font-size:15.5px;line-height:1.45}
.gtm-link{margin-top:auto;padding-top:8px;font-weight:600;font-size:15px;text-underline-offset:4px}
@media (max-width:820px){.gtm-cases{grid-template-columns:1fr}}
@media (max-width:420px){.gtm-case dl > div{grid-template-columns:1fr;gap:2px}}
.launch{margin-top:clamp(40px,5vw,72px);border-top:3px solid var(--hl);padding-top:20px}
.launch-head h3{margin-top:8px;font-weight:700;font-stretch:94%;font-size:clamp(28px,3.4vw,48px);line-height:1;letter-spacing:-.03em}
.launch-head p{margin-top:10px;max-width:60ch;color:var(--muted);font-size:16px}
.launch-steps{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}
.launch-steps li{min-width:0;border-top:1px solid var(--line);padding-top:12px}
.launch-steps .mono{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.launch-steps h4{margin:6px 0 0;font-size:18px;font-weight:700}
.launch-steps p{margin-top:6px;font-size:14.5px;color:var(--muted);line-height:1.5}
@media (max-width:1000px){.launch-steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.launch-steps{grid-template-columns:1fr}}
.tools{margin-top:clamp(36px,4vw,56px);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.tools ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.tools li{border:1px solid var(--fg);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function media(p, cls="", label="Campaign image", invert=false, usePhoto=false){
  if(usePhoto && p.img){
    return `<div class="media photo ${cls}"><img src="${p.img}" alt="${esc(p.imgAlt)}" style="object-position:${p.imgPos||"center"}"></div>`;
  }
  const bg = invert ? p.b : p.a, fg = invert ? p.a : p.b;
  return `<div class="media ${cls}" style="background:var(${bg});color:var(${fg})" role="img" aria-label="${esc(p.client)} placeholder image">
    <div class="media-inner">${ART[p.art]}</div>
    <span class="tag">${label}</span>
  </div>`;
}

      <div class="numbers" id="tiktok-analysis">
        <div class="numbers-head">
          <h3>Inside the numbers</h3>
          <p class="numbers-lede">Every post is a small experiment. I use engagement analytics to track <mark>impressions</mark>, <mark>audience engagement</mark> and <mark>traffic</mark>, then turn what I find into the next creative decision.</p>
          <div class="method">
            <div><span class="mono">01 · Track</span><h4>Impressions &amp; reach</h4><p>Views, unique viewers, and where traffic comes from: followers, new viewers or recommendations.</p></div>

            <div><span class="mono">03 · Act</span><h4>The next post</h4><p>Adjust the hook, length, format and audience based on what the numbers show.</p></div>
          </div>
          <span class="numbers-video">TikTok: “Transferring as a sophomore”</span>
          <p>Posted Sept. 14, 2026 · 5:26 long · Source: TikTok Studio, Oct. 6, 2026</p>
        </div>
        <div class="numbers-shots">
            <figure class="numbers-shot">

              <figcaption class="mono muted">Performance · TikTok Studio</figcaption>
            </figure>
            <figure class="numbers-shot">
              <img src="tiktok-viewers.jpg" alt="TikTok Studio viewers tab: 19.0K total viewers; 97% new viewers and 3% returning; 100% non-followers; 83% female and 16% male.">
              <figcaption class="mono muted">Audience · TikTok Studio</figcaption>
            </figure>
        </div>
        <div class="numbers-sub">
          <span class="mono muted">How it performed</span>
          <h4>The performance</h4>
        </div>
        <div class="numbers-body">
          <div class="numbers-main">
            <dl class="stats">
              <div><dt>Views</dt><dd>24.3K</dd></div>
              <div><dt>Engagement rate</dt><dd>5.9%</dd><span>likes, comments, shares and saves ÷ views</span></div>
              <div><dt>Saves</dt><dd>145</dd></div>
              <div><dt>Avg. watch time</dt><dd>34.4s</dd><span>of a 5:26 video</span></div>
              <div><dt>Total play time</dt><dd>208 hrs</dd></div>
              <div><dt>Watched to the end</dt><dd>0.85%</dd></div>
            </dl>
            <div class="insights">
              <span class="mono muted">What the data says</span>
              <div class="insight"><h4>The topic landed.</h4><p>A 5.9% engagement rate and 145 saves suggest viewers treated the video as advice worth keeping, not just scrolling past.</p></div>
              <div class="insight"><h4>The length didn’t.</h4><p>The average viewer watched 34 seconds, about 10% of the video, and fewer than 1 in 100 finished it. The strongest advice needs to come in the first 30 seconds.</p></div>
              <div class="insight"><h4>Reach came fast.</h4><p>Views peaked on posting day and leveled off by the next day, and the video brought in 23 new followers. A follow-up series could turn one-time viewers into an audience.</p></div>
            </div>
          </div>
        </div>

        <div class="numbers-sub">
          <span class="mono muted">Who watched</span>
          <h4>The audience</h4>
        </div>
        <div class="numbers-body">
          <div class="numbers-main">
            <dl class="stats">
              <div><dt>Unique viewers</dt><dd>19.0K</dd><span>about 1.3 views per viewer</span></div>
              <div><dt>New viewers</dt><dd>97%</dd></div>
              <div><dt>Non-followers</dt><dd>100%</dd></div>
              <div><dt>Female viewers</dt><dd>83%</dd><span>16% male</span></div>
              <div><dt>Follower conversion</dt><dd>0.12%</dd><span>23 new followers ÷ 19.0K viewers</span></div>
            </dl>
            <div class="insights">
              <span class="mono muted">What the data says</span>
              <div class="insight"><h4>It reached strangers.</h4><p>Every viewer was a non-follower and 97% were seeing my content for the first time, so the video spread through recommendations, not my existing audience.</p></div>
              <div class="insight"><h4>Reach didn’t become an audience.</h4><p>Only 0.12% of viewers followed. Combined with the short watch time, it points to a hook that works and a payoff that comes too late.</p></div>
              <div class="insight"><h4>The audience is clear.</h4><p>83% of viewers were women, likely students facing the same decision. That shapes the next videos and which brand partners would fit.</p></div>
              <p class="next"><strong>What I’d test next:</strong> split the story into a 3-part short series for the same audience, open each with the key takeaway, and end with a clear reason to follow. Success means a higher completion rate and follower conversion above 0.5%.</p>
            </div>
          </div>
        </div>
      </div>
    </section>

function setMode(q){
  document.body.classList.toggle("quick", q);
  try{ localStorage.setItem("lk-quick", q ? "1" : "0"); }catch(e){}
  const f=document.getElementById("btn-full"), k=document.getElementById("btn-quick");
  if(f){ f.setAttribute("aria-pressed", String(!q)); k.setAttribute("aria-pressed", String(q)); }
}

function render(){
  const app = document.getElementById("app");
  const id = (location.hash||"").slice(1);
  const p = PROJECTS.find(x=>x.id===id);
  const setNav = k => { const n=document.querySelector(`[data-nav="${k}"]`); if(n) n.setAttribute("aria-current","page"); };
  document.querySelectorAll("[data-nav]").forEach(a=>a.removeAttribute("aria-current"));
  if(id==="writing" || id==="social" || id==="work"){
    app.innerHTML = id==="writing" ? writing() : id==="social" ? social() : workPage();
    window.scrollTo(0,0);
    document.title = (id==="writing" ? "Writing" : id==="social" ? "Social" : "Work") + " · Lauren Kim";
    setNav(id);
  } else if(p){
    app.innerHTML = caseStudy(p);
    document.getElementById("btn-full").onclick=()=>setMode(false);
    document.getElementById("btn-quick").onclick=()=>setMode(true);
    window.scrollTo(0,0);
    document.title = p.client + " · Lauren Kim";
    setNav("work");
  } else {
    if(!app.querySelector(".me")) app.innerHTML = aboutPage();
    document.title = "Lauren Kim";
    setNav(id==="contact" ? "contact" : "about");
    if(id==="contact") document.getElementById("contact-sec").scrollIntoView();
    else window.scrollTo(0,0);
  }
}
